name: Release to Maven Central

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  publish:
    uses: flowdigger/github-workflows/.github/workflows/publish-maven-central.yml@v1
    secrets: inherit
    with:
      java-version: "21"
      gradle-task: "publish"
      clone-flowdigger-gradle: true
      flowdigger-gradle-ref: "main"
