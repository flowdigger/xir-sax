name: Coverage

on:
  push:
    branches: ["main", "release/**"]
  pull_request:
    branches: ["main", "release/**"]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read
  id-token: write

jobs:
  coverage:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Clone flowdigger-gradle for composite build
        run: |
          if [ ! -d ../flowdigger-gradle/.git ]; then
            git clone --depth 1 --branch main https://github.com/flowdigger/flowdigger-gradle.git ../flowdigger-gradle
          fi

      - name: Set up Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Clone flowdigger-gradle for composite build
        run: |
          if [ ! -d ../flowdigger-gradle/.git ]; then
            git clone --depth 1 --branch main https://github.com/flowdigger/flowdigger-gradle.git ../flowdigger-gradle
          fi

      - name: Make wrapper executable
        run: chmod +x ./gradlew

      - name: Run coverage
        run: ./gradlew clean coverage --stacktrace --no-daemon

      - name: Upload JaCoCo HTML report
        uses: actions/upload-artifact@v7
        with:
          name: jacoco-html-report
          path: build/reports/jacoco/test/html/

      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@v7
        with:
          use_oidc: true
          files: build/reports/jacoco/test/jacocoTestReport.xml
          fail_ci_if_error: false
