name: Build and Test

on:
  push:
    branches: ["main", "release/**"]
  pull_request:
    branches: ["main", "release/**"]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        java-version: [ '21' ]

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Clone flowdigger-gradle for composite build
        run: |
          if [ ! -d ../flowdigger-gradle/.git ]; then
            git clone --depth 1 --branch main https://github.com/flowdigger/flowdigger-gradle.git ../flowdigger-gradle
          fi

      - name: Set up JDK ${{ matrix.java-version }}
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: ${{ matrix.java-version }}
          cache: gradle

      - name: Clone flowdigger-gradle for composite build
        run: |
          if [ ! -d ../flowdigger-gradle/.git ]; then
            git clone --depth 1 --branch main https://github.com/flowdigger/flowdigger-gradle.git ../flowdigger-gradle
          fi
      - name: Make wrapper executable
        run: chmod +x ./gradlew

      - name: Run build and tests
        run: ./gradlew clean build --stacktrace --no-daemon
